name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier check
        run: npx prettier --check '**/*.{ts,tsx,mjs,css,json,md}'
      - name: Run ESLint
        run: npm run lint
      - name: TypeScript check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify referenced assets exist
        run: npm run check-assets
      - name: Build static export
        run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Serve export (GitHub Pages layout)
        run: node ./scripts/serve-export.js 3199 &
      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3199/Project-Adobo-Website/ > /dev/null && exit 0
            sleep 1
          done
          echo "preview server did not start" && exit 1
      - name: Run Lighthouse (desktop)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3199/Project-Adobo-Website/
          configPath: ./lighthouserc.json
      - name: Run Lighthouse (mobile)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3199/Project-Adobo-Website/
          configPath: ./lighthouserc-mobile.json

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static export
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npx playwright test
