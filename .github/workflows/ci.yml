name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier check
        run: npx prettier --check "**/*.{js,css,html,json,md}"
      - name: Run ESLint
        run: npx eslint . --ext .js
      - name: Fail if linting/formatting failed
        if: ${{ failure() }}
        run: exit 1